<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>象棋直播 · 控制台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #2c3e50, #4a6278); color: #222; }
  header { padding: 16px 28px; color: #fff; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  header .dot.off { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

  .shell { display: flex; gap: 22px; padding: 6px 28px 28px; align-items: flex-start; flex-wrap: wrap; }

  /* 棋盘 */
  .board-card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #board svg { display: block; border-radius: 6px; }

  /* 右侧面板：固定宽度，避免刷新跳动 */
  .panel { width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: #7a8794; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin: 7px 0; font-size: 14px; min-height: 20px; }
  .row .v { text-align: right; color: #2c3e50; font-weight: 500;
      max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fixed-box { font-size: 12.5px; color: #555; line-height: 1.6; height: 96px; overflow-y: auto;
      word-break: break-all; background: #f7f5ef; border-radius: 6px; padding: 8px 10px; }
  .fen-box { white-space: normal; }
  .best-move { font-size: 24px; font-weight: bold; color: #c0392b; }
  .tag { display: inline-block; padding: 2px 12px; border-radius: 10px; font-size: 12px; color: #fff; background: #95a5a6; }
  .tag.on { background: #27ae60; }

  /* 操作 */
  .btn { border: none; border-radius: 8px; padding: 12px; width: 100%; font-size: 16px; font-weight: 600;
      cursor: pointer; color: #fff; background: linear-gradient(135deg, #e67e22, #d35400);
      box-shadow: 0 3px 10px rgba(211,84,0,.35); transition: transform .05s, opacity .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .manual { display: flex; gap: 8px; margin-top: 10px; }
  .manual input { flex: 1; padding: 9px 10px; border: 1px solid #cfd6dd; border-radius: 8px; font-size: 14px; }
  .manual button { width: 72px; border: none; border-radius: 8px; background: #34495e; color: #fff;
      cursor: pointer; font-size: 14px; }
  .opmsg { min-height: 20px; margin-top: 10px; font-size: 13px; text-align: center; }
  .opmsg.ok { color: #27ae60; }
  .opmsg.fail { color: #c0392b; }
  .err-banner { background: #fdecea; color: #c0392b; border-radius: 8px; padding: 10px 14px;
      font-size: 14px; font-weight: 600; display: none; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="headDot"></span>
    <h1>象棋直播 · 控制台</h1>
  </header>

  <div class="shell">
    <div class="board-card">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="err-banner" id="err"></div>

      <div class="card">
        <h3>对局状态</h3>
        <div class="row"><span>引擎</span><span class="v" id="engine">-</span></div>
        <div class="row"><span>行棋方</span><span class="v" id="side">-</span></div>
        <div class="row"><span>分析模式</span><span class="v"><span class="tag" id="amode">-</span></span></div>
        <div class="row"><span>思考中</span><span class="v"><span class="tag" id="thinking">-</span></span></div>
        <div class="row" style="align-items:flex-start"><span>FEN</span>
          <div class="fixed-box fen-box" id="fen" style="height:auto;min-height:20px;max-height:64px">-</div>
        </div>
      </div>

      <div class="card">
        <h3>引擎推荐</h3>
        <div class="row"><span>最佳着法</span><span class="v best-move" id="bestmove">-</span></div>
        <div class="row"><span>中文</span><span class="v" id="bestcn">-</span></div>
        <div class="row"><span>分数 / 深度</span><span class="v" id="score">-</span></div>
        <div class="row"><span>杀棋步数</span><span class="v" id="mate">-</span></div>
      </div>

      <div class="card">
        <h3>走子操作</h3>
        <button class="btn" id="playBtn">走推荐着法</button>
        <div class="manual">
          <input id="manualMove" placeholder="手动着法，如 b0c2">
          <button id="manualBtn">走子</button>
        </div>
        <div class="opmsg" id="opmsg"></div>
      </div>

      <div class="card">
        <h3>主变</h3>
        <div class="fixed-box" id="pv">-</div>
      </div>
    </div>
  </div>

<script>
const NAMES = {
  K: '帅', A: '仕', B: '相', N: '马', R: '车', C: '炮', P: '兵',
  k: '将', a: '士', b: '象', n: '马', r: '车', c: '炮', p: '卒'
};
let currentBest = null;

/* 棋盘几何：棋子在交叉点（9 列 x 10 行） */
const M = 30;      // 边距
const S = 56;      // 交叉点间距
const PR = 24;     // 棋子半径
const X = i => M + i * S;
const Y = i => M + i * S;

function firstCn(moveCn) {
  if (!moveCn) return '';
  return (moveCn.split(/[\s　]+/).filter(Boolean)[0]) || '';
}

function renderBoard(board) {
  const W = M * 2 + 8 * S, H = M * 2 + 9 * S;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#f2dcae"/>`;
  s += `<defs><radialGradient id="pieceGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#fff8ec"/><stop offset="100%" stop-color="#e8d3a4"/>
        </radialGradient></defs>`;

  // 横线 10 条
  for (let y = 0; y < 10; y++) {
    s += `<line x1="${X(0)}" y1="${Y(y)}" x2="${X(8)}" y2="${Y(y)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  }
  // 竖线：外侧贯通，中间在河界处断开
  for (let x = 0; x < 9; x++) {
    if (x === 0 || x === 8) {
      s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
    } else {
      s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(4)}" stroke="#8a6a34" stroke-width="1.4"/>`;
      s += `<line x1="${X(x)}" y1="${Y(5)}" x2="${X(x)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
    }
  }
  // 九宫斜线
  s += `<line x1="${X(3)}" y1="${Y(0)}" x2="${X(5)}" y2="${Y(2)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  s += `<line x1="${X(5)}" y1="${Y(0)}" x2="${X(3)}" y2="${Y(2)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  s += `<line x1="${X(3)}" y1="${Y(7)}" x2="${X(5)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  s += `<line x1="${X(5)}" y1="${Y(7)}" x2="${X(3)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  // 河界文字
  const ry = (Y(4) + Y(5)) / 2;
  s += `<text x="${X(1)}" y="${ry + 8}" font-size="22" font-weight="bold" fill="#8a6a34" letter-spacing="10">楚河</text>`;
  s += `<text x="${X(7)}" y="${ry + 8}" font-size="22" font-weight="bold" fill="#8a6a34" letter-spacing="10" text-anchor="end">漢界</text>`;

  // 棋子（交叉点）
  for (let y = 0; y < 10; y++) {
    for (let x = 0; x < 9; x++) {
      const ch = board[y][x];
      if (ch && ch !== ' ') {
        const cx = X(x), cy = Y(y);
        const color = (ch >= 'A' && ch <= 'Z') ? '#c0392b' : '#1a1a1a';
        s += `<circle cx="${cx}" cy="${cy}" r="${PR}" fill="url(#pieceGrad)" stroke="#c19a5b" stroke-width="1.5"/>`;
        s += `<text x="${cx}" y="${cy + 8}" text-anchor="middle" font-size="23" font-weight="bold" fill="${color}">${NAMES[ch] || ch}</text>`;
      }
    }
  }
  s += '</svg>';
  document.getElementById('board').innerHTML = s;
}

function setTag(id, on, text) {
  const el = document.getElementById(id);
  el.className = 'tag' + (on ? ' on' : '');
  el.textContent = text;
}

function setOp(ok, text) {
  const el = document.getElementById('opmsg');
  el.className = 'opmsg ' + (ok ? 'ok' : 'fail');
  el.textContent = text;
}

async function play(move) {
  if (!move) { setOp(false, '没有可走的着法'); return; }
  document.getElementById('playBtn').disabled = true;
  setOp(true, '走子请求中…');
  try {
    const r = await fetch('/api/play', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({move})
    });
    const d = await r.json();
    if (d.ok) { setOp(true, '走子成功：' + (d.move || move)); }
    else { setOp(false, '走子失败：' + (d.error || r.status)); }
  } catch (e) {
    setOp(false, '请求失败：' + e.message);
  }
  document.getElementById('playBtn').disabled = false;
  refresh();
}

async function refresh() {
  try {
    const resp = await fetch('/api/state');
    const d = await resp.json();
    if (!resp.ok || d.error) throw new Error(d.error || ('HTTP ' + resp.status));
    document.getElementById('err').style.display = 'none';
    document.getElementById('headDot').className = 'dot';

    renderBoard(d.board || []);
    document.getElementById('engine').textContent =
      (d.engine_name || '-') + (d.engine_loaded ? '（已加载）' : '（未加载）');
    document.getElementById('side').textContent = d.side_to_move === 'red' ? '红方' : '黑方';
    setTag('amode', d.analysis_mode, d.analysis_mode ? '开启' : '关闭');
    setTag('thinking', d.thinking, d.thinking ? '是' : '否');
    document.getElementById('fen').textContent = d.fen;

    currentBest = d.analysis && d.analysis.best;
    if (currentBest) {
      document.getElementById('bestmove').textContent = currentBest.best_move || '-';
      document.getElementById('bestcn').textContent = currentBest.move_cn || '-';
      document.getElementById('score').textContent = currentBest.score + ' / ' + currentBest.depth;
      document.getElementById('mate').textContent = currentBest.mate ? currentBest.mate : '-';
      document.getElementById('pv').textContent = (currentBest.moves || []).join('  ');
      const cn = firstCn(currentBest.move_cn) || currentBest.best_move;
      document.getElementById('playBtn').textContent = '走推荐着法（' + cn + '）';
      document.getElementById('playBtn').disabled = !!d.thinking;
    } else {
      ['bestmove','bestcn','score','mate','pv'].forEach(id => document.getElementById(id).textContent = '-');
      document.getElementById('playBtn').textContent = '走推荐着法';
      document.getElementById('playBtn').disabled = true;
    }
  } catch (e) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'TCHESS 不可达：' + e.message;
    document.getElementById('headDot').className = 'dot off';
    document.getElementById('playBtn').disabled = true;
  }
}

document.getElementById('playBtn').addEventListener('click', () => play(currentBest && currentBest.best_move));
document.getElementById('manualBtn').addEventListener('click', () =>
  play(document.getElementById('manualMove').value.trim()));
document.getElementById('manualMove').addEventListener('keydown', e => {
  if (e.key === 'Enter') play(e.target.value.trim());
});

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
