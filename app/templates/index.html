<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>象棋直播 · 控制台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #2c3e50, #4a6278); color: #222; }
  header { padding: 16px 28px; color: #fff; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  header .dot.off { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

  .shell { display: flex; gap: 22px; padding: 6px 28px 28px; align-items: flex-start; flex-wrap: wrap; }

  /* 棋盘 */
  .board-card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #board svg { display: block; border-radius: 6px; }

  /* 右侧面板：固定宽度，避免刷新跳动 */
  .panel { width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: #7a8794; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin: 7px 0; font-size: 14px; min-height: 20px; }
  .row .v { text-align: right; color: #2c3e50; font-weight: 500;
      max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fixed-box { font-size: 12.5px; color: #555; line-height: 1.6; height: 96px; overflow-y: auto;
      word-break: break-all; background: #f7f5ef; border-radius: 6px; padding: 8px 10px; }
  .fen-box { white-space: normal; }
  .best-move { font-size: 24px; font-weight: bold; color: #c0392b; }
  .tag { display: inline-block; padding: 2px 12px; border-radius: 10px; font-size: 12px; color: #fff; background: #95a5a6; }
  .tag.on { background: #27ae60; }

  /* 操作 */
  .btn { border: none; border-radius: 8px; padding: 12px; width: 100%; font-size: 16px; font-weight: 600;
      cursor: pointer; color: #fff; background: linear-gradient(135deg, #e67e22, #d35400);
      box-shadow: 0 3px 10px rgba(211,84,0,.35); transition: transform .05s, opacity .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .manual { display: flex; gap: 8px; margin-top: 10px; }
  .manual input { flex: 1; padding: 9px 10px; border: 1px solid #cfd6dd; border-radius: 8px; font-size: 14px; }
  .manual button { width: 72px; border: none; border-radius: 8px; background: #34495e; color: #fff;
      cursor: pointer; font-size: 14px; }
  .manual button:disabled { opacity: .5; cursor: not-allowed; }
  .opmsg { min-height: 20px; margin-top: 10px; font-size: 13px; text-align: center; }
  .opmsg.ok { color: #27ae60; }
  .opmsg.fail { color: #c0392b; }
  .err-banner { background: #fdecea; color: #c0392b; border-radius: 8px; padding: 10px 14px;
      font-size: 14px; font-weight: 600; display: none; }
  .mini-btn { border: none; border-radius: 6px; padding: 8px; width: 100%; font-size: 13px;
      cursor: pointer; color: #fff; background: #34495e; margin-top: 6px; }
  .mini-btn:hover { background: #2c3e50; }
  .mini-btn:disabled { opacity: .6; cursor: wait; }
  .watch-msg { font-size: 12px; color: #8a6a34; margin-top: 6px; text-align: center; min-height: 16px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .mini-btn { flex: 1; margin-top: 0; }
  .sync-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: #27ae60; margin-right: 6px; vertical-align: middle; }
  .sync-dot.off { background: #c0392b; }
  #syncTxt { vertical-align: middle; }

  /* 战术意图卡片 */
  .intent-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .ictag { display:inline-block; padding:3px 10px; border-radius:10px; font-size:12px; color:#fff; font-weight:600; }
  .ictag.phase { background:#7a8794; }
  .ictag.opening-badge { background:#b8860b; }
  .intent-primary { font-size:18px; font-weight:bold; color:#2c3e50; margin:4px 0 2px; }
  .intent-detail { font-size:13px; color:#555; margin-bottom:8px; line-height:1.5; }
  .intent-meta { font-size:12.5px; color:#666; margin:3px 0; }
  .reason-list { list-style:none; margin:8px 0 0; padding:8px 0 0; border-top:1px dashed #d5dce2; }
  .reason-list li { font-size:12.5px; color:#444; line-height:1.6; padding-left:14px; position:relative; }
  .reason-list li::before { content:''; position:absolute; left:2px; top:8px; width:5px; height:5px; border-radius:50%; background:#95a5a6; }
  .hist-empty { font-size:12.5px; color:#999; padding:6px 0; }

  /* 盘面事实快照 */
  .fact-wrap { margin-top:10px; border-top:1px dashed #d5dce2; padding-top:8px; }
  .fact-title { font-size:12px; color:#7a8794; font-weight:600; margin:2px 0 6px; }
  .fact-change { font-size:12.5px; margin-bottom:4px; color:#444; line-height:1.5; }
  .fact-stage { font-size:11px; color:#95a5a6; margin:7px 0 3px; }
  .fact-grid { display:grid; grid-template-columns:34px repeat(4,1fr); gap:4px; }
  .fact-grid .fg-head { color:#95a5a6; text-align:center; font-size:10.5px; }
  .fact-grid .fg-side { font-weight:bold; color:#2c3e50; font-size:11px; align-self:center; }
  .fact-grid .fg-cell { text-align:center; background:#f4f6f8; border-radius:6px; padding:3px 2px; font-size:11px; color:#333; }
  .fact-grid .fg-cell.warn { background:#fdecea; color:#c0392b; font-weight:600; }

  /* 意图历史 */
  .hist-list { list-style:none; margin:0; padding:0; }
  .hist-list li { display:flex; gap:8px; align-items:center; font-size:12.5px; padding:5px 0; border-bottom:1px solid #eee; }
  .hist-list .hmove { font-family:Consolas,monospace; font-weight:bold; color:#2c3e50; min-width:52px; }
  .hist-list .hlabel { flex:1; color:#444; }
  .hist-list .hdot { width:8px; height:8px; border-radius:50%; flex:none; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="headDot"></span>
    <h1>象棋直播 · 控制台</h1>
  </header>

  <div class="shell">
    <div class="board-card">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="err-banner" id="err"></div>

      <div class="card">
        <h3>对局状态</h3>
        <div class="row"><span>引擎</span><span class="v" id="engine">-</span></div>
        <div class="row"><span>我方</span><span class="v" id="myside">-</span></div>
        <div class="row"><span>行棋方</span><span class="v" id="side">-</span></div>
        <div class="row"><span>盘面</span><span class="v"><span class="sync-dot" id="syncDot"></span><span id="syncTxt">-</span></span></div>
        <div class="row"><span>分析模式</span><span class="v"><span class="tag" id="amode">-</span></span></div>
        <div class="row"><span>思考中</span><span class="v"><span class="tag" id="thinking">-</span></span></div>
        <div class="row" style="align-items:flex-start"><span>FEN</span>
          <div class="fixed-box fen-box" id="fen" style="height:auto;min-height:20px;max-height:64px">-</div>
        </div>
        <div class="btn-row">
          <button class="mini-btn" id="engineReload">重新加载引擎</button>
          <button class="mini-btn" id="syncBtn">同步盘面</button>
        </div>
        <div class="watch-msg" id="watchmsg">-</div>
      </div>

      <div class="card">
        <h3>引擎推荐</h3>
        <div class="row"><span>最佳着法</span><span class="v best-move" id="bestmove">-</span></div>
        <div class="row"><span>中文</span><span class="v" id="bestcn">-</span></div>
        <div class="row"><span>分数 / 深度</span><span class="v" id="score">-</span></div>
        <div class="row"><span>杀棋步数</span><span class="v" id="mate">-</span></div>
      </div>

      <div class="card">
        <h3>战术意图</h3>
        <div id="intentBox">
          <div class="hist-empty">等待己方回合计算意图…</div>
        </div>
      </div>

      <div class="card">
        <h3>走子操作</h3>
        <button class="btn" id="playBtn">走推荐着法</button>
        <div class="manual">
          <input id="manualMove" placeholder="手动着法，如 b0c2">
          <button id="manualBtn">走子</button>
        </div>
        <div class="opmsg" id="opmsg"></div>
      </div>

      <div class="card">
        <h3>主变</h3>
        <div class="fixed-box" id="pv">-</div>
      </div>

      <div class="card">
        <h3>意图历史（最近 10 步）</h3>
        <ul class="hist-list" id="intentHist">
          <li class="hist-empty">暂无记录</li>
        </ul>
      </div>
    </div>
  </div>

<script>
const NAMES = {
  K: '帅', A: '仕', B: '相', N: '马', R: '车', C: '炮', P: '兵',
  k: '将', a: '士', b: '象', n: '马', r: '车', c: '炮', p: '卒'
};
let currentBest = null;

/* 大类配色（categoryCode -> 颜色） */
const CAT_COLORS = {
  mate: '#c0392b', defense: '#2980b9', capture: '#d35400',
  threat: '#8e44ad', position: '#16a085', development: '#7f8c8d', invalid: '#555'
};
let intentHistory = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderFacts(facts) {
  if (!facts) return '';
  const cols = [
    ['inCheck', '将军'], ['legalMoveCount', '走法'], ['unrooted', '无根'],
    ['attacked', '被抓'],
  ];
  let s = '<div class="fact-wrap"><div class="fact-title">盘面客观事实（走前 → 走后）</div>';
  const ch = facts.change || {};
  s += '<div class="fact-change">吃子对比：';
  if (ch.captured) {
    s += `少子，被吃 ${esc(ch.captured_name)}（${esc(ch.captured_pos)}，${ch.captured_side === 'red' ? '红' : '黑'}方）`;
  } else {
    s += `无吃子（棋子数 ${ch.before_count}→${ch.after_count}）`;
  }
  s += '</div>';
  for (const [stageKey, stageCn] of [['before', '走前'], ['after', '走后']]) {
    s += `<div class="fact-stage">${stageCn}</div><div class="fact-grid"><div></div>`;
    for (const c of cols) s += `<div class="fg-head">${c[1]}</div>`;
    for (const [sideKey, sideCn] of [['red', '红'], ['black', '黑']]) {
      const b = facts[stageKey][sideKey];
      s += `<div class="fg-side">${sideCn}</div>`;
      for (const [key] of cols) {
        const v = b[key];
        const n = Array.isArray(v) ? v.length : (v ? '是' : '否');
        const warn = (key === 'inCheck' && v) || (Array.isArray(v) && v.length);
        s += `<div class="fg-cell ${warn ? 'warn' : ''}">${esc(String(n))}</div>`;
      }
    }
    s += '</div>';
  }
  s += '</div>';
  return s;
}

function renderIntent(it) {
  const box = document.getElementById('intentBox');
  if (!it) {
    box.innerHTML = '<div class="hist-empty">对方回合或暂无推荐，意图仅在己方回合计算</div>';
    return;
  }
  const color = CAT_COLORS[it.categoryCode] || '#7f8c8d';
  let s = '<div class="intent-head">';
  s += `<span class="ictag" style="background:${color}">${esc(it.categoryCn)}</span>`;
  s += `<span class="ictag phase">${esc(it.phaseCn)}</span>`;
  if (it.openingCn) s += `<span class="ictag opening-badge">开局·${esc(it.openingCn)}</span>`;
  s += '</div>';
  s += `<div class="intent-primary">${esc(it.primaryCn)}</div>`;
  s += `<div class="intent-detail">${esc(it.primaryDetail)}</div>`;
  s += `<div class="intent-meta">着法：${esc(it.move)}（${esc(it.pieceCn)} ${esc(it.fromPos)}→${esc(it.toPos)}）</div>`;
  if (it.moveVerb) s += `<div class="intent-meta">中文叫法：${esc(it.moveVerb)}</div>`;
  if (it.capturedCn) s += `<div class="intent-meta">吃子：${esc(it.capturedCn)}</div>`;
  if (it.reasons && it.reasons.length) {
    s += '<ul class="reason-list">';
    for (const r of it.reasons) s += `<li>${esc(r)}</li>`;
    s += '</ul>';
  }
  s += renderFacts(it.facts);
  box.innerHTML = s;
}

function pushHistory(d) {
  if (!d.intent) return;
  const sig = d.fen + '|' + d.intent.move;
  if (intentHistory.length && intentHistory[0].sig === sig) return;
  intentHistory.unshift({sig, intent: d.intent});
  if (intentHistory.length > 10) intentHistory.length = 10;
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('intentHist');
  if (!intentHistory.length) {
    el.innerHTML = '<li class="hist-empty">暂无记录</li>';
    return;
  }
  let s = '';
  for (const h of intentHistory) {
    const it = h.intent;
    const color = CAT_COLORS[it.categoryCode] || '#7f8c8d';
    s += `<li><span class="hdot" style="background:${color}"></span>`
       + `<span class="hmove">${esc(it.move)}</span>`
       + `<span class="hlabel">${esc(it.primaryCn)}</span></li>`;
  }
  el.innerHTML = s;
}

/* 棋盘几何：棋子在交叉点（9 列 x 10 行） */
const M = 30;      // 边距
const S = 56;      // 交叉点间距
const PR = 24;     // 棋子半径
const X = i => M + i * S;
const Y = i => M + i * S;

function firstCn(moveCn) {
  if (!moveCn) return '';
  return (moveCn.split(/[\s　]+/).filter(Boolean)[0]) || '';
}

function renderBoard(board, reverse) {
  const W = M * 2 + 8 * S, H = M * 2 + 9 * S;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#f2dcae"/>`;
  s += `<defs><radialGradient id="pieceGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#fff8ec"/><stop offset="100%" stop-color="#e8d3a4"/>
        </radialGradient></defs>`;

  // 横线 10 条
  for (let y = 0; y < 10; y++) {
    s += `<line x1="${X(0)}" y1="${Y(y)}" x2="${X(8)}" y2="${Y(y)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  }
  // 竖线：外侧贯通，中间在河界处断开
  for (let x = 0; x < 9; x++) {
    if (x === 0 || x === 8) {
      s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
    } else {
      s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(4)}" stroke="#8a6a34" stroke-width="1.4"/>`;
      s += `<line x1="${X(x)}" y1="${Y(5)}" x2="${X(x)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
    }
  }
  // 九宫斜线
  s += `<line x1="${X(3)}" y1="${Y(0)}" x2="${X(5)}" y2="${Y(2)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  s += `<line x1="${X(5)}" y1="${Y(0)}" x2="${X(3)}" y2="${Y(2)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  s += `<line x1="${X(3)}" y1="${Y(7)}" x2="${X(5)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  s += `<line x1="${X(5)}" y1="${Y(7)}" x2="${X(3)}" y2="${Y(9)}" stroke="#8a6a34" stroke-width="1.4"/>`;
  // 河界文字（翻转时左右互换，保持文字正立可读）
  const ry = (Y(4) + Y(5)) / 2;
  const leftWord = reverse ? '漢界' : '楚河';
  const rightWord = reverse ? '楚河' : '漢界';
  s += `<text x="${X(1)}" y="${ry + 8}" font-size="22" font-weight="bold" fill="#8a6a34" letter-spacing="10">${leftWord}</text>`;
  s += `<text x="${X(7)}" y="${ry + 8}" font-size="22" font-weight="bold" fill="#8a6a34" letter-spacing="10" text-anchor="end">${rightWord}</text>`;

  // 棋子（交叉点）；reverse 时标准坐标映射到旋转 180° 后的显示位置
  for (let y = 0; y < 10; y++) {
    for (let x = 0; x < 9; x++) {
      const ch = board[y][x];
      if (ch && ch !== ' ') {
        const dx = reverse ? 8 - x : x;
        const dy = reverse ? 9 - y : y;
        const cx = X(dx), cy = Y(dy);
        const color = (ch >= 'A' && ch <= 'Z') ? '#c0392b' : '#1a1a1a';
        s += `<circle cx="${cx}" cy="${cy}" r="${PR}" fill="url(#pieceGrad)" stroke="#c19a5b" stroke-width="1.5"/>`;
        s += `<text x="${cx}" y="${cy + 8}" text-anchor="middle" font-size="23" font-weight="bold" fill="${color}">${NAMES[ch] || ch}</text>`;
      }
    }
  }
  s += '</svg>';
  document.getElementById('board').innerHTML = s;
}

function setTag(id, on, text) {
  const el = document.getElementById(id);
  el.className = 'tag' + (on ? ' on' : '');
  el.textContent = text;
}

function setOp(ok, text) {
  const el = document.getElementById('opmsg');
  el.className = 'opmsg ' + (ok ? 'ok' : 'fail');
  el.textContent = text;
}

async function play(move) {
  if (!move) { setOp(false, '没有可走的着法'); return; }
  const btn = document.getElementById('playBtn');
  btn.disabled = true;
  setOp(true, '走子请求中…');
  let failed = false;
  try {
    const r = await fetch('/api/play', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({move})
    });
    const d = await r.json();
    if (d.ok) { setOp(true, '走子成功：' + (d.move || move)); }
    else { setOp(false, '走子失败：' + (d.error || r.status)); failed = true; }
  } catch (e) {
    setOp(false, '请求失败：' + e.message);
    failed = true;
  }
  if (failed) btn.disabled = false;  // 成功时按钮状态由 refresh 按回合决定
  refresh();
}

async function refresh() {
  try {
    const resp = await fetch('/api/state');
    const d = await resp.json();
    if (!resp.ok || d.error) throw new Error(d.error || ('HTTP ' + resp.status));
    document.getElementById('err').style.display = 'none';
    document.getElementById('headDot').className = 'dot';

    renderBoard(d.board || [], d.is_reverse);
    renderIntent(d.intent);
    const engEl = document.getElementById('engine');
    engEl.textContent =
      (d.engine_name || '-') + (d.engine_loaded ? '（已加载）' : '（未加载）');
    engEl.style.color = d.engine_loaded ? '' : '#c0392b';
    document.getElementById('watchmsg').textContent = d.engineWatch || '';
    const syncDot = document.getElementById('syncDot');
    syncDot.className = 'sync-dot' + (d.in_sync ? '' : ' off');
    document.getElementById('syncTxt').textContent = d.in_sync ? '一致' : '不一致';
    document.getElementById('myside').textContent = d.my_side === 'red' ? '红方' : '黑方';
    document.getElementById('side').textContent = d.side_to_move === 'red' ? '红方' : '黑方';
    setTag('amode', d.analysis_mode, d.analysis_mode ? '开启' : '关闭');
    setTag('thinking', d.thinking, d.thinking ? '是' : '否');
    document.getElementById('fen').textContent = d.fen;

    // 仅在己方回合取推荐；对方回合（含等待对方）推荐为空
    currentBest = (d.my_turn && d.analysis) ? d.analysis.best : null;
    const manualBtn = document.getElementById('manualBtn');
    if (currentBest) {
      document.getElementById('bestmove').textContent = currentBest.best_move || '-';
      document.getElementById('bestcn').textContent = currentBest.move_cn || '-';
      document.getElementById('score').textContent = currentBest.score + ' / ' + currentBest.depth;
      document.getElementById('mate').textContent = currentBest.mate ? currentBest.mate : '-';
      document.getElementById('pv').textContent = (currentBest.moves || []).join('  ');
      const cn = firstCn(currentBest.move_cn) || currentBest.best_move;
      document.getElementById('playBtn').textContent = '走推荐着法（' + cn + '）';
      document.getElementById('playBtn').disabled = !!d.thinking;
      manualBtn.disabled = !!d.thinking;
    } else {
      ['bestmove','bestcn','score','mate','pv'].forEach(id => document.getElementById(id).textContent = '-');
      document.getElementById('playBtn').textContent =
        d.my_turn ? '走推荐着法' : '等待对方走子…';
      document.getElementById('playBtn').disabled = true;
      manualBtn.disabled = true;
    }
    pushHistory(d);
  } catch (e) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'TCHESS 不可达：' + e.message;
    document.getElementById('headDot').className = 'dot off';
    document.getElementById('playBtn').disabled = true;
  }
}

document.getElementById('engineReload').addEventListener('click', async (e) => {
  const btn = e.target;
  btn.disabled = true;
  btn.textContent = '加载中…';
  try {
    const r = await fetch('/api/engine/reload', {method: 'POST'});
    const d = await r.json();
    document.getElementById('watchmsg').textContent =
      d.ok ? '引擎加载成功' : ('加载失败：' + (d.error || ''));
  } catch (err) {
    document.getElementById('watchmsg').textContent = '请求失败：' + err.message;
  }
  btn.disabled = false;
  btn.textContent = '重新加载引擎';
  refresh();
});

document.getElementById('syncBtn').addEventListener('click', async (e) => {
  const btn = e.target;
  btn.disabled = true;
  btn.textContent = '同步中…';
  try {
    const r = await fetch('/api/sync', {method: 'POST'});
    const d = await r.json();
    document.getElementById('watchmsg').textContent =
      d.ok ? '盘面已同步' : ('同步失败：' + (d.error || ''));
  } catch (err) {
    document.getElementById('watchmsg').textContent = '请求失败：' + err.message;
  }
  btn.disabled = false;
  btn.textContent = '同步盘面';
  refresh();
});

document.getElementById('playBtn').addEventListener('click', () => play(currentBest && currentBest.best_move));
document.getElementById('manualBtn').addEventListener('click', () =>
  play(document.getElementById('manualMove').value.trim()));
document.getElementById('manualMove').addEventListener('keydown', e => {
  if (e.key === 'Enter') play(e.target.value.trim());
});

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
